name: Crawl and Release

on:
  push:
    branches:
      - master

jobs:
  crawl-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run crawler
        run: npm start

      - name: Generate release tag
        id: tag
        run: echo "tag=v$(date +'%Y.%m.%d-%H%M%S')" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Shoutcast Directory ${{ steps.tag.outputs.tag }}
          body: Automated crawl of the Shoutcast directory.
          files: shoutcast-directory.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
