name: Crawl and Release

on:
  push:
    branches:
      - master
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

jobs:
  crawl-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run crawler
        run: npm start

      - name: Update latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Shoutcast Directory (Latest)
          body: Automated crawl of the Shoutcast directory.
          files: shoutcast-directory.json
          overwrite_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
